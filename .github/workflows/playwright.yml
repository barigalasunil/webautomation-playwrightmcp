name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run framework tests (smoke)
      # Explicitly force headless mode in CI. Without this, the per-browser config in
      # src/config/test-input.json (browserMode.chromium: "headed") forces Chromium to
      # launch headed, which requires an X server that ubuntu-latest runners don't have
      # ("Missing X server or $DISPLAY"). --mode=headless overrides the config default.
      run: npm run ai:smoke -- --mode=headless
      env:
        CI: true
    - name: Generate Allure Report
      if: ${{ !cancelled() }}
      # reports.ts resolves the active test-reports_* run folder itself.
      run: npm run report:allure:generate
    - name: Upload Run Folder (reports + results + screenshots)
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v4
      with:
        name: test-reports
        # Single consolidated artifact: the whole test-reports_<datetime>_<url> folder
        path: test-reports_*/
        retention-days: 30
